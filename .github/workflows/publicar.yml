
name: Publicar produto ACHADOS Select

on:
  issues:
    types:
      - opened
      - labeled

permissions:
  contents: write

jobs:
  publicar:
    if: >-
      github.event.issue.user.login == 'felipee333' &&
      contains(github.event.issue.labels.*.name, 'publicar-produto')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Atualizar catalogo
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          produto = json.loads(os.environ["ISSUE_BODY"])

          if not isinstance(produto, dict):
              raise ValueError("Produto invalido")

          obrigatorios = ["nome", "categoria", "link"]

          for campo in obrigatorios:
              valor = produto.get(campo)
              if not isinstance(valor, str) or not valor.strip():
                  raise ValueError("Campo invalido: " + campo)

          url = urlparse(produto["link"])
          if url.scheme != "https" or not url.hostname:
              raise ValueError("Link HTTPS invalido")

          caminho = Path("catalogo.json")
          dados = json.loads(caminho.read_text(encoding="utf-8"))

          if isinstance(dados, list):
              produtos = dados
          elif isinstance(dados, dict) and isinstance(
              dados.get("produtos"), list
          ):
              produtos = dados["produtos"]
          else:
              raise ValueError("Formato do catalogo desconhecido")

          produtos.append(produto)

          caminho.write_text(
              json.dumps(dados, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Produto adicionado ao catalogo")
          PY

      - name: Publicar no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json

          if ! git diff --cached --quiet; then
            git commit -m "Adicionar produto ao catalogo"
            git push origin HEAD:main
          fi
